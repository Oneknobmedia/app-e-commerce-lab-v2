        S.store.customerLogin = login;
        renderProps(true); commit(); break;
      }
      case 'ship-quote': {
        const sh = S.store.ship = S.store.ship || {};
        sh.quoteByChat = !shipCfg().quoteByChat;
        render(); renderProps(true); commit(); break;
      }
      case 'ship-free-region': {
        const region = a.dataset.option;
        if (!Object.hasOwn(COMUNAS_RAW, region)) break;
        const selected = shipCfg().freeRegions;
        const sh = S.store.ship = S.store.ship || {};
        sh.freeRegions = selected.includes(region) ? selected.filter(value => value !== region) : [...selected, region];
        render(); renderProps(true); commit();
        const selectedGroup = document.querySelector('[data-act="ship-free-region"]')?.closest('details');
        if (selectedGroup) selectedGroup.open = true;
        break;
      }
      case 'ship-region': case 'ship-rm-free': {
        const sh = S.store.ship = S.store.ship || {};
        if (a.dataset.act === 'ship-region') { if (shipCfg().mode === 'region') delete sh.mode; else sh.mode = 'region'; }
        else sh.rmFree = !shipCfg().rmFree;
        render(); renderProps(true); commit(); break;
      }
      case 'svc-on':if (svcOn()) S.store.svc = false; else delete S.store.svc; VIEW.svc = false; render(); renderProps(true); commit(); toast(svcOn() ? 'Servicio técnico visible' : 'Servicio técnico oculto'); break;
      case 'p-nooffer': if (p) { delete p.old; delete p.tag; render(); renderProps(true); commit(); toast('Oferta quitada'); } break;
      case 'p-glow': { const pp = p; if (!pp) break; if (pp.glow) delete pp.glow; else pp.glow = 1; render(); renderProps(true); commit(); break; }
      case 'pal': openPal(); break;
      case 'remix': remixColors(); break;
      case 'vk': setView(a.dataset.v); renderOpt(); break;
      case 'sw-add': openPicker('__swatch', a); break;
      case 'sw-del': e.stopPropagation(); S.swatches.splice(+a.dataset.i, 1); renderProps(true); commit(); break;
      case 'sw-pick': navigator.clipboard && navigator.clipboard.writeText(S.swatches[+a.dataset.i]).then(() => toast('Color copiado: ' + S.swatches[+a.dataset.i]), () => {}); break;
      case 'font-del': S.fonts = S.fonts.filter(f => f.id !== a.dataset.id); applyStyles(); renderProps(true); commit(); break;
    }
  });
  pr.addEventListener('pointerdown', e => {
    const s = e.target.closest('[data-scrub]'); if (!s) return;
    const inp = s.parentElement.querySelector('input'); if (!inp) return;
    e.preventDefault();
    const x0 = e.clientX, v0 = parseFloat(inp.value || inp.placeholder) || 0, step = parseFloat(inp.step) || 1, path = inp.dataset.p;
    const mn = inp.min === '' ? -Infinity : +inp.min, mx = inp.max === '' ? Infinity : +inp.max;
    let moved = false;
    track(ev => {
      const d = Math.round((ev.clientX - x0) / 3) * step * (ev.shiftKey ? 10 : 1);
      if (!d && !moved) return; moved = true;
      const v = clamp(r2(v0 + d), mn, mx); inp.value = v; setField(path, 'num', String(v));
    }, () => { if (moved) commit(); else inp.focus(); });
  });

  $$('.ed-dsw [data-dock]').forEach(b => b.addEventListener('click', () => { b.blur(); setDock(b.dataset.dock); }));
  setDock(lsGet('catgen2:dock'));
  const pw0 = lsGet('catgen2:pw'); if (pw0) $('#ed').style.setProperty('--pw', clamp(pw0, 130, 520) + 'px');
  $('#ed-grip').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); const ed = $('#ed');
    track(ev => { const r = ed.getBoundingClientRect(); const w = Math.round(clamp(r.right - ev.clientX, 130, Math.min(520, r.width * .7))); ed.style.setProperty('--pw', w + 'px'); lsSet('catgen2:pw', w); if (V.auto) fit(); }, () => { if (V.auto) fit(); else drawOv(); });
  });
  if (lsGet('catgen2:nodock') === 1 || matchMedia(PHONE_ED).matches) $('#ed').classList.add('ed-nodock');
  if ('ResizeObserver' in window && vp) { let lw = 0, lh = 0; new ResizeObserver(es => { const r = es[0].contentRect, w = Math.round(r.width), h = Math.round(r.height); if (w === lw && h === lh) return; lw = w; lh = h; if (!ED.on || ED.preview) return; requestAnimationFrame(() => { if (V.auto) fit(); else drawOv(); }); }).observe(vp); }

  $('#ed-file').addEventListener('change', e => {
    const fsl = [...e.target.files], m = (fileFor || '').match(/^prod:([^:]+)/), mc = (fileFor || '').match(/^col:([^:]+):(\d+)$/), mg = (fileFor || '').match(/^pics:(.+)$/);
    if (fsl.length) { if (mg) addPics(fsl, mg[1]); else if (mc) addSlotPhotos(fsl, mc[1], +mc[2]); else if (fileFor === 'bg') bgImageFile(fsl[0]); else if (m) addProdPhotos(fsl, m[1]); else if (fileFor === 'hero+') addHeroFiles(fsl); else if (/^gic:/.test(fileFor || '')) gicImgFile(fsl[0], fileFor.slice(4)); else addImageFile(fsl[0], fileFor); }
    fileFor = null;
  });
  $('#ed-cfile').addEventListener('change', e => { const f = e.target.files[0]; if (f) openCatalog(f); });
  $('#ed-ffile').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const name = file.name.replace(/\.(ttf|otf|woff2?)$/i, '').replace(/[^\w\- ]/g, ' ').trim() || 'Fuente';
      if (r.result.length > 240000 && mode === 'viewer') toast('La fuente pesa más de lo que guarda la nube: se usa en esta sesión y en el HTML exportado.');
      S.fonts.push({id: uid(), name, data: r.result});
      applyStyles(); renderProps(true); renderOpt(); commit();
      toast('Fuente «' + name + '» lista en el selector de cada texto');
    };
    r.readAsDataURL(file);
  });

  pkDrag($('#pk-sv'), (x, y) => { PK.s = x; PK.v = 1 - y; });
  pkDrag($('#pk-hue'), x => { PK.h = x * 360; });
  pkDrag($('#pk-al'), x => { PK.a = r2(x); });
  $('#pk-hex').addEventListener('input', e => { const c = parseColor(e.target.value.trim().replace(/^([0-9a-f]{6})$/i, '#$1')); if (!c) return; Object.assign(PK, rgb2hsv(c)); if (c.a < 1) PK.a = c.a; pkPaint(true); });
  $('#pk-ap').addEventListener('input', e => { PK.a = clamp(num(e.target.value) / 100, 0, 1); pkPaint(true); });
  $('#pk-sw').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; const c = parseColor(b.dataset.c); if (!c) return; Object.assign(PK, rgb2hsv(c), {a: c.a}); pkPaint(true); });
  $('#pk-add').addEventListener('click', () => { const s = colorStr(pkCur()); if (!S.swatches.includes(s)) S.swatches.push(s); pkSwatches(); if (!ui.sel.length) renderProps(true); commit(); toast('Muestra añadida'); });
  $('#pk-clr').addEventListener('click', () => { if (PK.path && PK.path !== '__swatch') { setField(PK.path, 'color', ''); PK.touched = true; renderProps(true); } closePicker(); });
  $('#pk-ok').addEventListener('click', closePicker);
}

function edAfter() {
  ui.sel = ui.sel.filter(exists);
  if (ui.scope && !exists(ui.scope)) ui.scope = null;
  if (ui.hover && !exists(ui.hover)) ui.hover = null;
  const n = $('#ed-name'); if (n) n.textContent = S.store.name || 'Catálogo';
  if (board) board.style.width = ui.vw + 'px';
  pinBar(); renderLayers(); renderProps(); drawOv(); updUndo(); trkIcons();
  if ($('#ed-pal') && !$('#ed-pal').hidden) palFoot();
}

function mountEditor() {
  if (ED.on || PUB) return;
  ED.on = true; edit = true;
  document.body.appendChild($('#edshell').content.cloneNode(true));
  document.body.classList.add('ed-on');
  board = $('#ed-board'); vp = $('#ed-vp'); ov = $('#ed-ov'); stage = $('#ed-stage');
  board.appendChild($('#cat'));
  ui.vk = vkWin(); ui.vw = VKW[ui.vk]; VV.need = true;
  const sn = lsGet('catgen2:snap'); if (typeof sn === 'boolean') ui.snap = sn;
  ui.open = new Set(lsGet('catgen2:open') || []);
  board.style.width = ui.vw + 'px';
  $$('kbd[data-k]').forEach(k => { k.textContent = kl(!IS_MAC && k.dataset.kw ? k.dataset.kw : k.dataset.k); });
  $$('[data-tip]').forEach(b => { const [t, s] = b.dataset.tip.split('|'); b.title = s ? t + ' (' + kl(s) + ')' : t; });
  /* «Mi panel» solo existe en el sitio con cuenta */
  if (!CLOUD) $$('[data-cmd="exitPanel"]').forEach(b => { b.hidden = true; });
  else { /* foto de perfil del usuario (la pone la pantalla de inicio en window.ECL.me) */
    const me = CLOUD.me || {}, nm = String(me.nick || me.username || CLOUD.user || '').trim(), ph = String(me.photo || '');
    $$('.ed-home').forEach(b => {
      const a = document.createElement('i'); a.className = 'ed-av'; a.setAttribute('aria-hidden', 'true');
      if (/^(data:image\/|https:\/\/)/.test(ph)) a.style.backgroundImage = 'url(' + JSON.stringify(ph) + ')'; else a.textContent = (nm.charAt(0) || '?').toUpperCase();
      b.insertBefore(a, b.querySelector('span'));
      if (nm) b.title = 'Salir del editor y volver a mi panel (' + (me.username ? '@' + me.username : nm) + ')';
    });
  }
  $('#ed-hp').textContent = 'Atajos para ' + (IS_MAC ? 'Mac (⌘ Comando, ⌥ Opción, ⇧ Mayúsculas)' : 'Windows (Ctrl, Alt, Mayús)') + '. Clic selecciona un bloque; doble clic entra en él o edita un texto. Arrastra para mover; las manijas cambian el tamaño y el punto superior rota.';
  $('#ed-keys').innerHTML = HELP.map(([l, s]) => `<div><span>${esc(l)}</span><kbd>${esc(kl(s))}</kbd></div>`).join('');
  $$('[data-only="pub"]').forEach(x => { x.hidden = !(mode === 'viewer' && canPublish); });
  bindEditor();
  bindUI();
  bindPal();
  setTool('nav');
  render();
  hReset();
  if (!S.g10) {
    S.cats.forEach(c => { const n = pgSize(c), r = c.products.length % n; if (r || !c.products.length) for (let i = r; i < n; i++) c.products.push(np()); });
    S.g10 = 1; render(); commit();
  }
  requestAnimationFrame(fit);
}
function unmountEditor() {
  if (!ED.on) return;
  if (ui.editing) { const t = editEl(); ui.editing = null; if (t) { t.removeAttribute('contenteditable'); t.classList.remove('ed-editing'); } }
  document.body.insertBefore($('#cat'), document.body.firstChild);
  ['#ed', '#ed-exit', '#pv', '#ed-trkd', '#ed-help', '#ed-pk', '#ed-pal', '#ed-file', '#ed-ffile', '#ed-cfile', '#pl-file'].forEach(s => { const x = $(s); if (x) x.remove(); });
  document.body.classList.remove('ed-on');
  ED.on = false; ED.preview = false; edit = false;
  board = vp = ov = stage = null;
  render();
}

render();
if (mode === 'local') { save(); mountEditor(); }
if (mode === 'viewer') connect();
})();
</script>
