/* Catálogo de tienda tipo app: barra de beneficios, cabecera con búsqueda, portada 2:1, pastillas de categorías, tarjetas con oferta y botón +, y barra de pestañas fija. Look claro fijo a propósito; los colores salen de la paleta de cada tienda. */
:root{--border:#1e5eff;--btn:#000000;--btn-fg:#ffffff;--bg:#ffffff;--fg:#111111;--muted:#6b6b6b;--line:#e8e8eb;--price-bg:transparent;--price-bd:#e6e7ea;--foot:58px;--foot-bg:#000000;--foot-fg:#ffffff;--sale:#e5251d;--tag:#d4af37;--tag-fg:#1a1300;--sale-fg:#ffffff;--link:var(--border);--chip:color-mix(in srgb,var(--fg) 6%,var(--bg));--sz-bg:color-mix(in srgb,var(--btn) 7%,var(--bg));--sz-fg:var(--fg);--sz-bd:color-mix(in srgb,var(--btn) 26%,var(--bg));--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#cat{position:relative;background:none;color:var(--fg);padding-bottom:calc(var(--foot) + 24px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--border);outline-offset:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}#cat.rvl .rv{transition:opacity .6s ease var(--rd,0s)!important}#cat.rvl .rv:not(.in){scale:none!important}.card.glow .ph,.card.glow .ph::after,.chip.glow,.chip.glow::after,.cat.glow .cat-h::after{animation-duration:8s!important}}

.sv{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap}
.sv:empty{display:none}
.sv::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sv[data-s=ok]::before{background:var(--ok)}
.sv[data-s=busy]::before{background:var(--warn)}
.sv[data-s=bad]::before{background:var(--bad)}

/* barra de beneficios y cabecera */
.promo{position:relative;z-index:16;--gl:var(--foot-bg);--hl:0;--gal:92%;--m-out:0 0 0 transparent;--m-flat:none;color:var(--foot-fg);padding:8px 16px;text-align:center;font-size:13px;font-weight:700;line-height:1.3}
.promo:empty{display:none}
.promo p{max-width:var(--cw);margin:0 auto;overflow-wrap:break-word;text-wrap:balance}
.promo p:empty::before{content:"Doble clic para escribir un beneficio: envío, cuotas o retiro";opacity:.65;font-weight:600}
.top{position:sticky;top:0;z-index:15;--gl:var(--bg);--hl:0;--gal:72%;--gb:20px;--m-out:0 6px 18px -12px rgba(0,0,0,.25);--m-flat:none;display:flex;align-items:center;gap:10px;min-height:58px;padding:8px var(--hp);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.bt{min-width:0}
.top h1{font-size:20px;line-height:1.15;font-weight:800;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:break-word}
.top .logo{display:block;flex:none;width:auto;height:auto;max-width:min(180px,55%);max-height:44px;object-fit:contain}
.top .nmh{line-height:0}
.top .nmi{display:block;width:auto;height:auto;max-width:min(240px,100%);max-height:40px;object-fit:contain}
#cat[data-vk=ml] .top .nmi{max-height:30px}
#cat[data-vk=w] .top .nmi{max-height:54px;max-width:min(360px,100%)}
.tg{font-size:12px;line-height:1.3;color:var(--muted);margin-top:1px;overflow-wrap:break-word}
.srch-b{flex:none;width:44px;height:44px;margin-right:-10px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.srch-b svg{width:22px;height:22px}
.srch-b[aria-expanded=true]{background:var(--chip)}
.logo-drop{flex:none;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border:2px dashed #bbb;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
.logo-drop button{height:28px;padding:0 10px;border-radius:7px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:11.5px}
.srch{padding:10px var(--hp) 0}
.srch-in{position:relative;--gl:var(--chip);--hl:.5;display:flex;align-items:center;gap:8px;height:46px;padding:0 4px 0 14px;border-radius:12px}
.srch-in:focus-within{box-shadow:0 0 0 2px var(--link)}
.srch-in svg{flex:none;width:18px;height:18px;color:var(--muted)}
.srch input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:16px;outline:none}
.srch input::-webkit-search-cancel-button{display:none}
.srch-x{flex:none;width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;color:var(--muted)}
.hero-wrap{max-width:var(--cw);margin:14px auto 0;padding:0 var(--px);container-type:inline-size}
.hero-wrap:empty{display:none}
.hero{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:16px;max-width:100%}
.hero-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:2/1;max-width:100%;border:2px dashed #bbb;border-radius:16px;background:var(--chip);color:var(--muted);text-align:center;padding:16px;font-size:13px;line-height:1.35}
.hero-drop b{font-size:15px;color:var(--fg)}
@container (min-width:640px){.hero,.hero-drop{aspect-ratio:3/1}}
.hero-drop button{height:36px;padding:0 14px;border-radius:8px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:13px}

/* categorías en pastillas: «Todo» muestra cada categoría; una pastilla muestra solo esa */
.chips{max-width:var(--cw);margin:16px auto 0;padding:0 var(--px);display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{position:relative;flex:none;--gl:var(--chip);height:42px;padding:0 18px;border-radius:21px;color:var(--fg);font-size:15px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{--gl:var(--btn);color:var(--btn-fg)}
.chips{padding-block:4px 8px}

/* secciones y productos */
main{max-width:var(--cw);margin:0 auto;padding:0 var(--px);container-type:inline-size}
.cat{position:relative;padding-top:24px;scroll-margin-top:8px}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.cat h2{min-width:0;font-size:20px;line-height:1.2;font-weight:800;color:var(--title,var(--fg));overflow-wrap:break-word;text-wrap:balance}
.more{flex:none;display:inline-flex;align-items:center;gap:1px;min-height:32px;margin:-6px -4px -6px 0;padding:0 4px;color:var(--link);font-size:15px;font-weight:700;white-space:nowrap}
.more svg{width:16px;height:16px}
.cnt{flex:none;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* cada cuadrícula es una página de N productos; las páginas se deslizan en horizontal */
.pager{position:relative}
.pages{--pp:12px;--c:var(--cm,2);display:grid;grid-auto-flow:column;grid-auto-columns:100%;column-gap:calc(var(--pp) * 2);margin:calc(var(--pp) * -1);padding:var(--pp);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pp);overscroll-behavior-x:contain;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{scroll-snap-align:start;scroll-snap-stop:always;min-width:0;display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:20px 12px;align-content:start}
.grid{--c:var(--cm,2);display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:20px 12px}
.pg{position:absolute;top:50%;z-index:6;--gl:var(--bg);width:38px;height:38px;margin-top:-19px;border-radius:50%;color:var(--fg);display:grid;place-items:center;transition:scale .15s}
.pg svg{width:18px;height:18px}
.pg:active{scale:.9}
.pg-prev{left:-15px}
.pg-side{position:absolute;right:-15px;top:50%;z-index:6;translate:0 -50%;display:flex;flex-direction:column;gap:8px}
.pg-side .pg{position:static;margin:0}
.dots{display:flex;justify-content:center;margin-top:10px}
.dots:empty{display:none}
.dots button{height:24px;padding:0 3px;display:grid;place-items:center}
.dots button::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .25s,background .25s}
.dots button.on::before{width:20px;background:var(--btn)}
/* la tarjeta mide su propio ancho: letras, precios y botón se ajustan a 2, 3, 4 o 5 columnas sin cortarse */
/* --ab: botón +, --bh: etiqueta de oferta. Ambos van montados en el borde de la foto (mitad afuera); --safe es el margen de la zona segura 1:1 donde el producto nunca queda tapado */
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:calc(var(--bh) / 2 + 6px);isolation:isolate;container-type:inline-size;--ab:clamp(26px,19cqi,34px);--bh:clamp(18px,12.5cqi,22px);--safe:calc(max(var(--ab),var(--bh)) / 2 + 1px)}
.phw{position:relative;min-width:0}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;border:1px solid var(--price-bd);border-radius:14px;overflow:hidden;background:var(--price-bg);display:grid;place-items:center;transition:box-shadow .3s}
.ph img{width:100%;height:100%;object-fit:contain;display:block;padding:var(--safe);transition:opacity .25s}
.ph>svg{width:34%;opacity:.22}
.off{position:absolute;left:0;top:calc(var(--bh) / -2);z-index:4;--gl:var(--sale);height:var(--bh);max-width:calc(100% - var(--ab) - 10px);display:inline-flex;align-items:center;padding:0 7px;border-radius:calc(var(--bh) / 2.6);color:var(--sale-fg);font-size:clamp(10px,6.6cqi,12px);font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.ph-r{position:absolute;right:0;bottom:calc(var(--ab) / -2);z-index:4;display:flex;align-items:center;justify-content:flex-end}
.aq{position:absolute;top:-6px;right:-6px;z-index:2;--gl:var(--sale);min-width:16px;height:16px;padding:0 4px;border-radius:8px;color:var(--sale-fg);font-size:10px;font-weight:800;line-height:16px;text-align:center}
.act{flex:none;position:relative;z-index:3;--gl:var(--btn);display:flex;align-items:center;height:var(--ab);min-width:var(--ab);border-radius:calc(var(--ab) / 2);color:var(--btn-fg);transition:scale .15s,box-shadow .2s}
.act:active{scale:.94}
.add{position:relative;width:var(--ab);height:100%;display:grid;place-items:center;border-radius:50%;color:inherit}
.add::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.add svg{width:64%;height:64%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.16))}
.step{display:flex;align-items:center;height:100%}
.step button{width:calc(var(--ab) * .84);height:100%;color:inherit;font-size:clamp(15px,10cqi,18px);font-weight:700;line-height:1}
.qty{width:calc(var(--ab) * .8);height:70%;padding:0;background:transparent;color:inherit;border:0;text-align:center;font-weight:800;font-size:clamp(12.5px,8.5cqi,15px);font-variant-numeric:tabular-nums}
.qty:focus-visible{outline:2px solid currentColor;outline-offset:0;border-radius:4px}
/* material de los componentes: cristal líquido, liso o degradado. Cada capa lo elige (o hereda el del documento) y siempre conserva su color --gl */
.mt{--m-bg:var(--gl);--m-bf:none;--m-sh:none;--m-hl:0;background:var(--m-bg);-webkit-backdrop-filter:var(--m-bf);backdrop-filter:var(--m-bf);box-shadow:var(--m-sh);isolation:isolate}
.mt::before{content:"";position:absolute;inset:1px 3px 52%;z-index:-1;border-radius:inherit;border-bottom-left-radius:40% 30%;border-bottom-right-radius:40% 30%;background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(255,255,255,0));pointer-events:none;opacity:var(--m-hl)}
.mt[data-m=glass]{--m-bg:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 50%,rgba(0,0,0,.1)),color-mix(in srgb,var(--gl) var(--gal,86%),transparent);--m-bf:blur(var(--gb,12px)) saturate(1.8);--m-sh:inset 0 1px .5px rgba(255,255,255,.7),inset 0 -1px 1px rgba(0,0,0,.16),inset 0 0 0 1px rgba(255,255,255,.26),var(--m-out,0 6px 16px -4px color-mix(in srgb,var(--gl) 55%,rgba(0,0,0,.35)),0 2px 5px rgba(0,0,0,.14));--m-hl:var(--hl,1)}
.mt[data-m=flat]{--m-sh:var(--m-flat,0 2px 6px rgba(0,0,0,.12))}
.mt[data-m=grad]{--m-bg:linear-gradient(160deg,color-mix(in srgb,var(--gl),#fff 26%),var(--gl) 55%,color-mix(in srgb,var(--gl),#000 18%));--m-sh:inset 0 1px 0 rgba(255,255,255,.35),var(--m-out,0 4px 12px -3px color-mix(in srgb,var(--gl) 50%,rgba(0,0,0,.3)))}
.desc{flex:none;font-size:clamp(12.5px,8cqi,15px);line-height:1.3;min-height:2.6em;margin-top:2px;overflow-wrap:break-word;hyphens:manual}
/* el + sobresale bajo la foto: un espacio flotante evita que la primera línea del nombre pase por debajo */
.desc::before{content:"";float:right;width:calc(var(--ab) + 4px);height:calc(var(--ab) / 2 - 2px)}
.card:has(.step) .desc::before{width:calc(var(--ab) * 2.5 + 4px)}
/* precio, precio anterior tachado y precio por mayor quedan alineados abajo aunque los nombres tengan distinto largo */
.prices{margin-top:auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;min-width:0}
.pr b{font-size:clamp(15px,10.6cqi,19px);font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr s{font-size:clamp(11.5px,7.4cqi,13.5px);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pm{font-size:clamp(11.5px,8cqi,14px);line-height:1.3;font-weight:700;color:var(--link);overflow-wrap:break-word}
.pm b{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.addp{aspect-ratio:1/1;border:2px dashed #bbb;border-radius:14px;color:var(--muted);font-weight:600;font-size:13px}
.empty{padding:24px 0;text-align:center;color:var(--muted)}

/* borde animado: luz retroiluminada que recorre el marco en sentido horario */
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes gspin{to{--ga:360deg}}
.card.glow .ph{overflow:visible;border-width:2px;border-color:transparent;background:linear-gradient(var(--price-bg),var(--price-bg)) padding-box,linear-gradient(var(--bg),var(--bg)) padding-box,conic-gradient(from var(--ga),var(--border) 0deg 190deg,var(--accent,var(--border)) 280deg,#fff 325deg,var(--accent,var(--border)) 345deg,var(--border) 360deg) border-box;animation:gspin 3s linear infinite}
.card.glow .ph img{border-radius:12px}
/* categoría destacada: la misma luz recorre su pastilla y subraya su título */
.chip.glow{box-shadow:0 0 12px -2px color-mix(in srgb,var(--accent,var(--border)) 70%,transparent)}
.chip.glow::after{content:"";position:absolute;inset:0;z-index:2;padding:2px;border-radius:inherit;background:conic-gradient(from var(--ga),var(--border) 0deg 190deg,var(--accent,var(--border)) 280deg,#fff 325deg,var(--accent,var(--border)) 345deg,var(--border) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:gspin 3s linear infinite;pointer-events:none}
.cat.glow .cat-h{position:relative;padding-bottom:8px}
.cat.glow .cat-h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:conic-gradient(from var(--ga) at 50% 50%,var(--border) 0deg 190deg,var(--accent,var(--border)) 280deg,#fff 325deg,var(--accent,var(--border)) 345deg,var(--border) 360deg);animation:gspin 3s linear infinite}
/* etiqueta de categoría: pequeña, montada en la esquina superior derecha (como las de los productos) para no alargar el nombre */
.ctag{position:absolute;z-index:3;display:inline-flex;align-items:center;pointer-events:none;border-radius:6px;background:var(--sale);color:var(--sale-fg);font-weight:800;letter-spacing:.04em;line-height:1;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
.mdf label{display:block;margin:12px 0 0;font-size:13px;font-weight:700}
.mdf input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:10px 12px;font:inherit;font-weight:500;border:1px solid var(--border,#c9ccd3);border-radius:10px;background:var(--bg,#fff);color:inherit}
.mdf .mdf-e{margin:10px 0 0;color:#d33;font-size:13px;font-weight:600}
#md .mb.mb-mdp{width:min(560px,calc(100vw - 24px));max-width:none}
.mdp-q{display:block;width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;border:1px solid var(--border,#c9ccd3);border-radius:10px;background:var(--bg,#fff);color:inherit}
.mdp-l{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-height:min(56vh,460px);overflow:auto}
.mdp-c{margin:0;padding:4px 10px 6px;border:1px solid var(--line,#d9dbe0);border-radius:10px;min-width:0}
.mdp-c legend{padding:0 6px;font-size:14px}
.mdp-c label{display:flex;align-items:center;gap:8px;cursor:pointer}
.mdp-p{padding:6px 0;font-size:14px;line-height:1.25}

.gbd{position:absolute;z-index:2;left:6px;bottom:6px;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;line-height:1;pointer-events:none;font-variant-numeric:tabular-nums}

/* ícono junto al nombre de una categoría con borde animado: por defecto la ★; c.gIc lo cambia por una forma (máscara con el color de acento), el logotipo de la tienda o una imagen propia, o lo quita */
.cat.glow.gno h2::before{content:none}

.chip .ctag{top:-7px;right:-4px;height:14px;padding:0 5px;font-size:8px;border-radius:5px}
.chips:has(.ctag){padding-top:10px}
.ct-w{position:relative;min-width:0}
.cat-h:has(.ctag){padding-top:10px}
.ct-w .ctag{top:-12px;left:calc(100% - 10px);height:15px;padding:0 6px;font-size:9px}

#cat:is([data-vk=t],[data-vk=tl],[data-vk=w]) .ct-w .ctag{height:16px;font-size:9.5px}

/* modo liviano (celulares y PCs de pocos recursos; se activa solo): sin desenfoques ni luces animadas, misma distribución */

#cat.fx .card.pop{scale:1.05;z-index:3}
#cat.fx .card.pop .ph{box-shadow:0 12px 26px rgba(0,0,0,.18)}

/* capas libres (texto, rectángulo, imagen, grupo) */
.fl{position:absolute;z-index:2;box-sizing:border-box}
.fl-text{font-size:16px;line-height:1.3;color:#111;white-space:pre-wrap;overflow-wrap:break-word;text-align:left}

.fl-ul li::before{content:"•"}
@keyframes edIn{from{opacity:0;translate:0 18px}}
@media(prefers-reduced-motion:reduce){.ed-in{animation:none!important}}

/* contacto al final del catálogo (la pestaña Contacto baja hasta aquí) */
.contact{max-width:var(--cw);margin:36px auto 0;padding:20px var(--px) 4px;border-top:1px solid var(--line);scroll-margin-top:12px}

.cl-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.cl-list a{position:relative;--gl:var(--chip);--hl:.4;display:flex;align-items:center;gap:10px;min-width:0;min-height:48px;padding:10px 14px;border-radius:12px;color:var(--fg);text-decoration:none;font-size:14px;line-height:1.3}

.cl-list span{min-width:0;overflow-wrap:anywhere}
[data-ph]:empty::before{content:attr(data-ph);color:var(--muted)}

/* barra de pestañas fija */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 max(0px,calc((100% - 560px) / 2)) env(safe-area-inset-bottom,0px);--gl:var(--bg);--hl:0;--gal:74%;--gb:22px;--m-out:0 -6px 20px rgba(0,0,0,.06);--m-flat:0 -6px 20px rgba(0,0,0,.06);border-top:1px solid var(--line)}

.tbi{position:relative;display:grid}
.badge{position:absolute;top:-5px;left:calc(100% - 9px);--gl:var(--sale);min-width:18px;height:18px;padding:0 4px;border-radius:9px;color:var(--sale-fg);font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge:empty{display:none}

/* paneles */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}

#menu,#cartp{transform:translateX(-100%)}

.ml{flex:1;overflow:auto}

/* tallas bajo los precios */
.szr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0;margin-top:clamp(4px,3cqi,8px)}
.szl{font-size:clamp(10.5px,6.6cqi,12px);font-weight:600;color:var(--muted);margin-right:1px}

.szb{position:relative;--gl:var(--btn);--hl:.35;flex:1 1 100%;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:clamp(34px,20cqi,44px);padding:5px clamp(8px,6cqi,16px);border-radius:999px;color:var(--btn-fg);text-align:center;transition:scale .15s,filter .15s}

@media(hover:hover){button.szb:hover{filter:brightness(1.12)}}
.szb .szl{min-width:0;margin:0;color:inherit;font-size:clamp(11.5px,6.6cqi,16px);font-weight:600;line-height:1.15;letter-spacing:.005em;text-wrap:balance;overflow-wrap:break-word}
.szb-n{flex:none;min-width:clamp(17px,10.5cqi,20px);height:clamp(17px,10.5cqi,20px);padding:0 5px;border-radius:10px;background:var(--sale);color:var(--sale-fg);font-size:clamp(10px,6cqi,11.5px);font-weight:800;line-height:1;display:grid;place-items:center;font-variant-numeric:tabular-nums}

.szpn{position:absolute;left:0;right:0;bottom:0;top:calc(var(--bh) / 2 + 6px);z-index:8;display:flex;flex-direction:column;gap:clamp(6px,4cqi,10px);min-width:0;padding:clamp(9px,6cqi,14px);border:1px solid var(--price-bd);border-radius:14px;background:var(--szbg,var(--bg));color:var(--fg);box-shadow:0 16px 36px -12px rgba(0,0,0,.4);animation:szIn .22s cubic-bezier(.2,.8,.2,1)}

.szpn-h{display:flex;align-items:center;gap:8px;min-width:0}
.szpn-t{flex:1;min-width:0;font-size:clamp(12.5px,7.6cqi,16px);font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.szpn-x{flex:none;width:clamp(28px,17cqi,34px);height:clamp(28px,17cqi,34px);margin:-3px -3px -3px 0;border-radius:50%;background:var(--chip);color:var(--fg);font-size:clamp(17px,10cqi,20px);line-height:1;display:grid;place-items:center}
.szpn-g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(36px,21cqi,52px),1fr));gap:clamp(6px,3.8cqi,9px);align-content:start;margin:-8px;padding:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.szpn .szc{width:100%;min-width:0;height:clamp(32px,19cqi,42px);padding:0 2px;border-radius:clamp(8px,5cqi,10px);font-size:clamp(12.5px,8cqi,16px);font-weight:700}

/* elegir talla */

/* diálogo propio (el visor bloquea confirm y alert) */

#cat{isolation:isolate}

.lb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(12,12,14,.55);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);color:#fff;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:lbIn .22s ease}

/* barra flotante del carrito: siempre a mano para terminar el pedido */
.wm{position:fixed;bottom:calc(var(--foot) + 66px + env(safe-area-inset-bottom,0px));z-index:18;display:flex;flex-direction:column;align-items:var(--wma,center);gap:3px;max-width:min(62vw,340px);width:fit-content;pointer-events:none;user-select:none;-webkit-user-select:none;opacity:var(--wmo,.4)}

@media print{.wm{display:none}}
.wmd{display:grid;gap:10px;font-size:13px;color:inherit}.wmd p{margin:0;opacity:.8;line-height:1.4}

.wmd-p{aspect-ratio:1.4;display:grid;place-items:center;border:1px dashed #bbb;background:repeating-conic-gradient(#f1f1f1 0 25%,#fff 0 50%) 0 0/12px 12px;overflow:hidden;color:#999;font-size:22px}

/* carrito */
.ce{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 24px;text-align:center;color:var(--muted)}

.ad{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ad b{font-size:14px;font-weight:800}.ad p{margin:0;font-size:13px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}.ad-sum p{color:var(--fg)}
.ad-need{outline:2px solid #dc2626;outline-offset:-2px;border-radius:10px}.ad-need .ad-n{color:#dc2626;font-weight:700}
.ad-b{min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font-size:14px;font-weight:700}
.ad-b.pri{background:var(--btn);color:var(--btn-fg);border-color:transparent}
.mb.mb-ad{overflow:hidden;width:min(100%,460px)}.mb-ad #mdb{flex:1 1 auto;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px}.mb-ad .ma{flex:none}.mb-ad .mbtn{flex:1;justify-content:center;height:46px}
.ad-form{display:flex;flex-direction:column;gap:2px;text-align:left}.ad-form .ad-n{margin:0 0 6px;font-size:13px;color:var(--muted)}
.ad-f{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px;font-weight:700}
.ad-f input,.ad-f select{height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;font-weight:500;width:100%}
.ad-f input:focus,.ad-f select:focus{outline:2px solid var(--btn);outline-offset:1px}
.ad-e{color:#dc2626;font-size:12.5px;font-weight:600}.ad-e:empty{display:none}.ad-h{color:var(--muted);font-size:12px}.ad-h:empty{display:none}
.ad-form .ad-b{margin-top:12px;min-height:40px;font-weight:600}
.cf .tot .ship.free b{color:#15803d;font-weight:800}.cf .tot .ship-n{justify-content:flex-start;font-size:12px;color:var(--muted)}
.cf .tot .tt{font-size:16px;font-weight:800}
.cname{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cname input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:transparent;color:var(--fg);font-size:15px;font-weight:400}
.cf-r{display:flex;justify-content:space-between;gap:12px}
.toast{display:flex;align-items:center;gap:12px}
.toast.act.on{pointer-events:auto}
/* panel menú/carrito: textos sin cortes */
#menu{width:max(33.333%,152px)}
.dh{gap:8px}.dht{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci>div{min-width:0}.ci p{font-size:14px;overflow-wrap:break-word}
.cf .tot div{gap:12px}.cf .tot span{white-space:nowrap}
.cf-r{flex-wrap:wrap}.cf-r>*{white-space:nowrap}
.send{padding:0 16px;text-align:center;font-size:15px}
/* pastillas rectas con logo de marca y menú tipo planilla */
.chip{border-radius:0;height:48px;min-width:76px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{box-shadow:none}
.chip-l{width:auto;height:30px;aspect-ratio:1;fill:currentColor;flex:none}
.chip-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.chip-t{font-size:13px}
.chip-w{height:19px;aspect-ratio:24/11.2}
.ml{--grid:color-mix(in srgb,var(--fg) 16%,var(--bg));--mf:14px;--mc:40px}
@media(max-width:480px){.ml{--mc:38px}.mlh{font-size:9px;letter-spacing:0}}
.mlh{display:grid;grid-template-columns:minmax(0,1fr) var(--mc);background:var(--chip);border-bottom:1px solid var(--grid);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.mlh span{padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mlh span+span{padding-inline:0}
.mlh span+span,.ml button small{border-left:1px solid var(--grid);text-align:center}
.ml button{display:grid;grid-template-columns:minmax(0,1fr) var(--mc);font-size:var(--mf);align-items:stretch;gap:0;padding:0;border-radius:0;border-bottom:1px solid var(--grid);overflow:hidden}
.ml button>span{min-width:0;padding:13px 5px;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;hyphens:none}
.ml.fit button>span{overflow-wrap:normal;word-break:normal}
.ml button small{white-space:nowrap}
.ml button small{display:grid;place-items:center;padding:0 4px}
.ml button:not(:has(small))::after{content:"";border-left:1px solid var(--grid)}
/* botones rectos: tallas, + / − 1 +, enviar pedido */
.szb,.act,.add,.add::after,.send,.szc,.szpn .szc,.szg button,.qty:focus-visible{border-radius:0}
/* sin superposiciones: etiqueta de oferta arriba de la foto, + debajo, contadores al costado */
.card{padding-top:calc(var(--bh) + 6px);--safe:8px}
.off{top:calc(var(--bh) * -1 - 4px);border-radius:0}
.ph-r{bottom:calc(var(--ab) * -1 - 6px)}
.desc{margin-top:6px}
.desc::before{height:calc(var(--ab) - 4px)}
.add{width:auto;min-width:var(--ab);padding:0 4px;display:flex;align-items:center;justify-content:center;gap:3px}
.add svg{width:calc(var(--ab) * .64);height:calc(var(--ab) * .64)}
.aq{position:static;--gl:var(--btn-fg);color:var(--btn);border-radius:0;box-shadow:none}
.card:has(.aq) .desc::before{width:calc(var(--ab) * 1.7 + 4px)}
/* con el selector − 1 + (producto en el carrito) el nombre baja entero bajo el selector, ancho completo y equilibrado: sin cruzarse con el precio */
.card:has(.step) .desc::before{width:100%;height:calc(var(--ab) + 4px)}
.card:has(.step) .desc{text-wrap:balance}
.badge{top:-4px;left:calc(100% + 1px);--gl:var(--btn);color:var(--btn-fg);border-radius:0}
.szb-n{background:var(--btn-fg);color:var(--btn);border-radius:0}
.szpn .szc[data-n]::after{top:2px;right:2px;min-width:13px;height:13px;line-height:13px;font-size:9px;border-radius:0;background:var(--btn);color:var(--btn-fg);box-shadow:none}
.szpn .szc.in[data-n]::after{background:var(--btn-fg);color:var(--btn)}
.szg small{background:var(--btn);color:var(--btn-fg);border-radius:0}
#cat.fx .card:hover,#cat.fx .card.pop{scale:none}
.card.glow .ph::after{display:none}
.pg{display:none}
/* productos cuadrados */
.ph,.card.glow .ph img,.addp,.szpn,.szpn-x,.th,.lb-ph,.lb-ph img{border-radius:0}
/* precio anterior en rojo intenso, con cualquier paleta */
.pr s{color:#ff0000}
.lb-p s{color:#ff3b3b;opacity:1}
/* pie del menú: carrito con subtotal */
.mcart{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--btn);color:var(--btn-fg);text-align:left;font-size:14px;font-weight:700}

#cat:has(.dr.on) .toast,body:has(.dr.on) .toast{display:none}
.mc-t{flex:1 1 100%;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
/* paneles sin capa oscura ni sombra encima del catálogo: terminan sobre la barra de pestañas, que queda usable */
.ov,.ov.on{background:transparent}
.dr{bottom:calc(var(--foot) + env(safe-area-inset-bottom,0px));--m-out:none;--m-flat:none;box-shadow:none;border-right:1px solid var(--line)}

/* carrito: punto medio entre un tercio y la mitad; su contenido se acomoda al ancho */

/* vistas: móvil (m) y tablet (t) en vertical y horizontal (ml, tl) y web (w). El script pone #cat[data-vk] según la pantalla

#cat{--cw:1100px;--px:16px;--hp:max(var(--px),calc((100% - var(--cw)) / 2 + var(--px)))}

#cat[data-vk=ml] :is(.pages,.grid){--c:var(--cml,var(--cm,2))}
#cat[data-vk=t] :is(.pages,.grid){--c:var(--ct,4)}
#cat[data-vk=tl] :is(.pages,.grid){--c:var(--ctl,var(--ct,4))}

/* portadas en carrusel: 16:9, pasan de derecha a izquierda dentro de la tarjeta; flechas, puntos y deslizar */

.ui-ph{position:absolute;left:6px;top:32px;z-index:5;width:24px;height:24px;border-radius:50%;background:rgba(27,28,31,.84);color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ui-ph svg{width:16px;height:16px}
.ui-crop{left:34px}
.ui-ph svg{width:13px;height:13px}
.szc.ui-sz{width:auto;padding:0 8px;border-style:dashed;border-color:rgba(0,0,0,.4);background:transparent;color:#3a3b40;font-weight:700}
.ed-vp #cat .szr[data-ui]{cursor:pointer;border-radius:6px;outline:1px dashed transparent;outline-offset:2px}
.ed-vp #cat .szr[data-ui]:hover{outline-color:#5e9cff}
.ui-sz:hover{border-color:var(--btn);color:var(--fg)}
.ed-on .szg button,.ed-on .szd input{background:#1b1c1f;color:#e3e4e8;border-color:#3b3e45}
.ed-on .szd .szg button.on{background:#5e9cff;border-color:#5e9cff;color:#fff;box-shadow:none}
.ed-on .szd p{color:#999ca5}
.bk-szl{min-width:0}
.ui-off{position:absolute;top:6px;left:6px;z-index:4;height:20px;padding:0 6px;border:1.5px dashed rgba(0,0,0,.4);border-radius:6px;background:rgba(255,255,255,.9);color:#3a3b40;font:700 9.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap}
.ui-off:hover{border-color:var(--sale);color:var(--sale)}
.ed-on:not(.ed-nav) #srch{display:none!important}
.crp{display:flex;flex-direction:column;gap:10px}
.crp-v{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto;overflow:hidden;border-radius:10px;touch-action:none;cursor:grab;background-color:#fff;background-image:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%);background-size:16px 16px;box-shadow:0 0 0 2px #5e9cff}
.crp-v:active{cursor:grabbing}
.crp-v img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-select:none}
.crp-z{display:flex;align-items:center;gap:10px;font-size:13px}
.crp-z input{flex:1;accent-color:#5e9cff}
.crp-n{font-size:12px!important;opacity:.75}
.ph-drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:28px 8px 46px;text-align:center;color:var(--muted);font-size:10.5px;line-height:1.25}
.ph-drop svg{width:22px;height:22px;opacity:.45}
.ph-drop button{height:24px;padding:0 10px;border-radius:12px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:10.5px}
.drop-on{outline:3px solid #5e9cff!important;outline-offset:-3px}
@container (max-width:150px){.ph-drop span,.ph-drop svg{display:none}.ph-drop{padding:26px 6px 42px}.ph-drop button{height:22px;padding:0 8px;font-size:10px}.ui-ph{width:22px;height:22px;top:30px}.ui-crop{left:31px}.ui-off{height:19px;padding:0 5px;font-size:9px}}
.gctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:-4px 0 12px;padding:6px 8px;border-radius:10px;background:#232428;color:#e3e4e8;font:500 11px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.gctl .gs{display:inline-flex;align-items:center;gap:5px}
.gctl button{width:26px;height:26px;border-radius:6px;background:#363840;color:#fff;font-size:15px;line-height:1}
.gctl b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.gctl em{font-style:normal;color:#999ca5;margin-left:auto}
.gctl button:disabled{opacity:.3;cursor:default}
.cat.cmv{animation:cmv 1.1s ease-out}
@keyframes cmv{from{outline:3px solid #5e9cff;outline-offset:4px}to{outline:3px solid transparent;outline-offset:4px}}
.pg-add{width:38px;height:38px;border-radius:50%;background:#232428;color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.28)}

/* subida masiva de productos */
.gctl .gbulk{width:auto;padding:0 10px;font-size:11px;font-weight:600;background:#5e9cff}
.bk{width:min(100%,760px);gap:14px}
.bk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bk input,.bk select{background:var(--e-bg);color:var(--e-fg);border:1px solid var(--e-l);border-radius:6px;height:32px;padding:0 9px;font:inherit;min-width:0;width:100%}
.bk input:focus,.bk select:focus{border-color:var(--e-a);outline:0}
.bk input.bad{border-color:#ff7a7a}
.bk label{display:flex;flex-direction:column;gap:4px;color:var(--e-m);font-size:11px;min-width:0}
.bk-drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border:2px dashed var(--e-l);border-radius:12px;text-align:center;color:var(--e-m);line-height:1.45;transition:border-color .15s,background .15s}
.bk-drop.on{border-color:var(--e-s);background:rgba(94,156,255,.1)}
.bk-drop svg{width:40px;height:40px;color:var(--e-a)}
.bk-dt{display:flex;flex-direction:column;gap:4px;max-width:46ch}
.bk-drop b{font-size:15px;line-height:1.3;color:var(--e-fg);text-wrap:balance}
.bk-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bk-btns .ed-b{height:34px}
.bk-drop.mini{flex-direction:row;flex-wrap:wrap;padding:12px 14px;text-align:left;justify-content:flex-start}
.bk-drop.mini svg{width:28px;height:28px}
.bk-drop.mini .bk-dt{flex:1 1 220px}
.bk-drop.mini b{font-size:13px}
.bk-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px 12px}
.bk-price{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--e-l);border-radius:10px;background:var(--e-bg)}
.bk-price .ed-tg{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 14px 0 8px;font-weight:600}
/* interruptor: encendido = un precio para todos; apagado = precio por producto */
#bk-same::before{content:"";flex:none;width:30px;height:18px;border-radius:9px;background:radial-gradient(circle at 9px 50%,#fff 6px,transparent 6.5px) var(--e-l);transition:background .15s}
#bk-same.on::before{background:radial-gradient(circle at 21px 50%,#fff 6px,transparent 6.5px) var(--e-s)}
.bk-def{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px 12px;width:100%}
.bk-n{color:var(--e-m);line-height:1.4}
.bk-auto{color:#8fd19e}
.bk-list{display:flex;flex-direction:column;gap:2px;max-height:min(42vh,420px);overflow:auto;padding:4px;border:1px solid var(--e-l);border-radius:10px;scrollbar-width:thin}
.bk-r{display:grid;grid-template-columns:44px minmax(0,1fr) 32px;gap:10px;align-items:center;padding:4px 6px;border-radius:7px}
.bk-r:nth-child(odd){background:var(--e-bg)}
.bk-r img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#fff}
.bk-fs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.bk-fs .bk-nm{flex:1 1 200px}
.bk-fs .bk-pd,.bk-fs .bk-pm{flex:0 1 110px}
.ed-calc{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px;border-radius:8px;background:rgba(94,156,255,.12);border:1px solid rgba(94,156,255,.4);font:500 12px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ed-calc>.ec-t{width:100%;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.ed-calc input{width:84px;padding:5px 7px;border-radius:6px;border:1px solid rgba(127,127,127,.45);background:rgba(0,0,0,.25);color:inherit;font:inherit}
.ed-calc b{color:#5e9cff;font-size:14px}
.ed-calc em{font-style:normal}
.bk-prog{height:6px;border-radius:3px;background:var(--e-l);overflow:hidden}
.bk-prog i{display:block;height:100%;width:0;background:var(--e-s);transition:width .2s}
.bk-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-foot #bk-msg{flex:1 1 180px;color:var(--e-m)}
.bk-foot .ed-b{height:34px}
.bk-foot .ed-b:disabled,.ed-tgs .ed-b:disabled{opacity:.45;cursor:default}
#ed-bulk.busy .bk-drop,#ed-bulk.busy .bk-opts,#ed-bulk.busy .bk-price,#ed-bulk.busy .bk-list{pointer-events:none;opacity:.55}

/* herramienta de paletas de colores */
.ed-pal{position:fixed;z-index:65;top:calc(env(safe-area-inset-top,0px) + 46px);right:8px;bottom:8px;width:min(400px,calc(100% - 16px));display:flex;flex-direction:column;background:var(--e-p);border:1px solid var(--e-l);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
.ed-pal button{color:inherit}
.ed-pal input:not([type=range]),.ed-pal select{background:var(--e-bg);color:var(--e-fg);border:1px solid var(--e-l);border-radius:6px;height:30px;padding:0 8px;font:inherit;min-width:0;width:100%}
.ed-pal input:focus,.ed-pal select:focus{border-color:var(--e-a);outline:0}
.ed-pal :focus-visible{outline:2px solid var(--e-a);outline-offset:1px}
.pl-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--e-l)}
.pl-h strong{font-size:13px}
.pl-x{width:32px;height:32px;border-radius:6px;font-size:20px;line-height:1}
.pl-x:hover{background:var(--e-h)}
.pl-min{font-size:15px;transition:transform .15s}
.ed-pal.mini{top:auto;height:auto}
.ed-pal.mini .pl-tabs,.ed-pal.mini .pl-body{display:none}
.ed-pal.mini .pl-min{transform:rotate(180deg)}
.pl-tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--e-l)}
.pl-tabs button{flex:1;height:32px;border-radius:6px;color:var(--e-m);white-space:nowrap;padding:0 6px;font-weight:600}
.pl-tabs button:hover{background:var(--e-r)}
.pl-tabs button.on{background:var(--e-h);color:#fff}
.pl-body{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.pl-f{display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--e-l);background:var(--e-r)}
.pl-fn{display:flex;justify-content:space-between;gap:8px;color:var(--e-m);font-size:11px}
.pl-fn b{color:var(--e-fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-acts{display:flex;gap:8px}
.pl-acts .ed-b{flex:1;height:38px;font-weight:600;font-size:13px}
.pl-strip{display:flex;height:34px;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pl-strip i{flex:1}
.pl-sz{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--e-m);font-size:11px}
.pl-sz>span{margin-right:2px;font-weight:600}
.pl-szb{width:24px;height:24px;border-radius:6px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.pl-szb.on{box-shadow:0 0 0 2px var(--e-r),0 0 0 4px var(--e-s)}
.pl-sz .pl-sza{height:24px;padding:0 8px;font-size:11px}
.pl-sz .pl-sza.on{border-color:var(--e-s);color:#fff}
.pl-szp{display:inline-flex;gap:3px;margin-left:auto;font-style:normal}
.pl-szp b{min-width:24px;height:22px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--sz-bd);background:var(--sz-bg);color:var(--sz-fg);font-size:11px}
.pl-szp b.in{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.pl-q{display:flex;gap:8px}
.pl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl-card{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:9px;background:var(--e-bg);border:1px solid var(--e-l);cursor:pointer;min-width:0}
.pl-card:hover{border-color:#50545d}
.pl-card.on{border-color:var(--e-s);box-shadow:0 0 0 1px var(--e-s)}
.pl-card .pl-strip{height:46px}
.pl-cn{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;font-size:11px}
.pl-cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-ic{flex:none;width:26px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--e-m)}
.pl-ic:hover{background:var(--e-h);color:var(--e-fg)}
.pl-ic svg{width:14px;height:14px}
.pl-lbl{color:var(--e-m);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pl-wheel{position:relative;width:min(100%,250px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0)),conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);touch-action:none;cursor:crosshair}
.pl-wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:#000;opacity:var(--dim,0);pointer-events:none}
.pl-wheel svg{position:absolute;inset:0;z-index:1;width:100%;height:100%;overflow:visible;pointer-events:none}
.pl-wheel line{stroke:#fff;stroke-width:1.2;opacity:.8}
.pl-mk{position:absolute;z-index:2;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.45);pointer-events:none}
.pl-mk.base{width:26px;height:26px;margin:-13px 0 0 -13px;border-width:3px}
.pl-mk.sel{box-shadow:0 0 0 2px var(--e-s),0 2px 8px rgba(0,0,0,.5)}
.pl-sws{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pl-sw{position:relative;height:50px;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.pl-sw.sel{box-shadow:0 0 0 2px var(--e-p),0 0 0 4px var(--e-s)}
.pl-sw.base::after{content:"";position:absolute;left:50%;bottom:5px;margin-left:-5px;border:5px solid transparent;border-bottom:7px solid #fff;filter:drop-shadow(0 0 1px #000)}
.pl-sl{display:grid;grid-template-columns:16px minmax(0,1fr) 54px;gap:8px;align-items:center;color:var(--e-m)}
.pl-sl input[type=number]{height:28px;padding:0 6px}
.pl-sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;background:var(--tr,var(--e-l));margin:0}
.pl-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #1b1c1f;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pl-sl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #1b1c1f}
.pl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-row>label{flex:1;display:flex;flex-direction:column;gap:4px;color:var(--e-m);font-size:11px;min-width:120px}
.pl-drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border:2px dashed var(--e-l);border-radius:10px;color:var(--e-m);text-align:center;line-height:1.4}
.pl-drop.on{border-color:var(--e-s);background:rgba(94,156,255,.08)}
.pl-img{position:relative;width:fit-content;max-width:100%;margin:0 auto;border-radius:8px;background:repeating-conic-gradient(#33353a 0 25%,#2a2c30 0 50%) 0 0/14px 14px;touch-action:none}
.pl-img img{display:block;max-width:100%;max-height:240px;border-radius:8px}
.pl-img .pl-mk{pointer-events:auto;cursor:grab;width:22px;height:22px;margin:-11px 0 0 -11px}
.pl-mine{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:9px;background:var(--e-bg);border:1px solid var(--e-l)}
.pl-mine.on{border-color:var(--e-s)}

/* cuando el editor está activo, los avisos del catálogo usan el tono del editor */
.ed-on .toast{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto;background:#2c2e33;color:#e3e4e8;border:1px solid #3b3e45;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ed-on .mb{background:#26272b;color:#e3e4e8;border:1px solid #3b3e45}
.ed-on .mb textarea{background:#1b1c1f;color:#e3e4e8;border-color:#3b3e45}
.ed-on .mbtn{background:#2f3136;border-color:#45474e;color:#e3e4e8}
.ed-on .mbtn.dk{background:#5e9cff;border-color:#5e9cff;color:#fff}
.ed-on .mapsd input{background:#1b1c1f;color:#e3e4e8;border-color:#3b3e45}
.ed-on .mapsd p{color:#999ca5}


/* zona segura 1:1 de cada foto y controles de la foto (solo en el editor) */
.ui-safe{position:absolute;inset:var(--safe);z-index:3;border:1px dashed rgba(94,156,255,.75);border-radius:6px;pointer-events:none}
.ui-safe span{position:absolute;left:3px;top:3px;font:600 8px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;color:#5e9cff;opacity:0;transition:opacity .15s}
.card:hover .ui-safe span,.ed-vp[data-tool=nav] .ui-safe span{opacity:1}
.ui-edph{position:absolute;right:0;top:-9px;z-index:6;height:18px;padding:0 7px 0 5px;border-radius:9px;display:inline-flex;align-items:center;gap:3px;background:rgba(27,28,31,.84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:600 9px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
.ui-edph svg{width:11px;height:11px}
.ui-edph:hover{background:#5e9cff}
.ui-off{top:-9px;left:0;height:18px;padding:0 6px;font-size:9px}
@container (max-width:150px){.ui-edph{width:18px;padding:0;justify-content:center}.ui-edph span{display:none}.ui-off{font-size:8.5px;padding:0 4px}}
/* menú «Editar foto» */
.ed-pm{position:fixed;z-index:86;width:236px;padding:5px;background:var(--e-r);border:1px solid var(--e-l);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.55);display:flex;flex-direction:column}
.ed-pm button{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:6px 10px;border-radius:6px;text-align:left;color:var(--e-fg)}
.ed-pm button:hover,.ed-pm button:focus-visible{background:var(--e-s);color:#fff}
.ed-pm button small{display:block;color:var(--e-m);font-size:10.5px;line-height:1.3}
.ed-pm button:hover small{color:#e8efff}
.ed-pm hr{border:0;border-top:1px solid var(--e-l);margin:4px 2px}
.ed-pm .ed-pmh{padding:6px 10px 4px;color:var(--e-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
/* el fondo del catálogo es la capa de más atrás: la mesa de trabajo no pinta otro */
.ed-board{background:none}
.ed-on #cat .pbg{position:absolute}
.ed-on #cat .top{position:relative}
/* ventanas del cliente dentro de la parte visible del lienzo (al navegar o al elegirlas en Capas) */
.ed-on #cat .lb{position:absolute;top:var(--lbt,0px);bottom:auto;height:var(--lbh,100vh);animation:none}
.ed-on #cat .lb-ph{width:min(100%,340px,calc(var(--lbh,640px) - 290px))}
.ed-on #cat .dr.on,.ed-on #cat .dr.ed-pin{display:flex;transform:none;position:absolute;max-width:100%;top:var(--lbt,0px);bottom:auto;height:var(--lbh,100vh)}
.ed-on #cat .ov.on{display:block;position:absolute;top:var(--lbt,0px);bottom:auto;height:var(--lbh,100vh)}
.ed-on #cat .fcart{position:absolute;bottom:auto;top:calc(var(--bt,0px) - 60px)}
.ed-on #cat .fcart:not(.ed-pin){display:none!important}
.ed-vp[data-tool=nav]{cursor:default}
.ed-vp[data-tool=nav] #cat [data-a],.ed-vp[data-tool=nav] #cat [data-a] *{cursor:pointer}
.ed-vp[data-tool=nav] #cat .ph[data-a=zoom]{cursor:zoom-in}

/* diálogos de foto: borrar fondo, mejorar calidad y fotos de colores */
.phd{display:flex;flex-direction:column;gap:10px}
.phd-v{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #3b3e45}
.phd-v canvas,.phd-v img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.phd-v[data-bgv=chk],.phd-cmp{background:repeating-conic-gradient(#3a3c42 0 25%,#2c2e33 0 50%) 0 0/16px 16px}

function localNames(){
  var out=[],pre='catgen:p:'+NS;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k||k.indexOf(pre)!==0||/:cart$/.test(k))continue;var n=k.slice(pre.length);if(!NS&&/^(as|u):/.test(n))continue;if(n)out.push(n)}}catch(e){}

/* este navegador quedó a nombre de otra cuenta, pero tiene proyectos de antes de las cuentas: se ofrece copiarlos a la cuenta actual */
function offerImport(){
  if(EC.imp||!NS)return;
  var old=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('catgen:p:')===0&&!/:cart$/.test(k)&&!/^catgen:p:(as|u):/.test(k)){var n=k.slice(9);if(n&&!has(CLOUD,n))old.push(n)}}}catch(e){}

  b.onclick=function(){
    b.disabled=true;b.textContent='Importando…';
    old.reduce(function(p,n){return p.then(function(){var t=null;try{t=localStorage.getItem('catgen:p:'+n)}catch(e){}return t?EC.put(n,t).then(function(){CLOUD.push(n);var l=load();if(!has(l,n))l.push(n);store(l)}):null})},Promise.resolve())
      .then(function(){b.remove();render();sync.textContent='Proyectos importados a tu cuenta';sync.dataset.s='ok'},function(){b.disabled=false;b.textContent='No se pudo importar. Toca para reintentar'});

function refresh(){
  sync.textContent='Sincronizando con tu cuenta…';sync.dataset.s='busy';
  EC.list().then(function(ps){
    CLOUD=ps.map(function(p){return p.name});
    /* todo lo guardado en este navegador, aunque no esté en la lista: proyectos hechos antes de las cuentas */
    var l=load();localNames().forEach(function(n){if(!has(l,n))l.push(n)});
    var m=CLOUD.slice();l.forEach(function(n){if(!has(m,n))m.push(n)});store(m);render();

    if(up.length){sync.textContent='Subiendo '+up.length+' proyecto'+(up.length>1?'s':'')+' de este navegador a tu cuenta…'}
    return up.reduce(function(p,n){return p.then(function(){return EC.put(n,lget(n)).then(function(){CLOUD.push(n)})})},Promise.resolve());
  }).then(function(){sync.textContent=(EC.imp?'Proyectos de @'+EC.user:'Tus proyectos están guardados en tu cuenta')+' · se ven en cualquier dispositivo';sync.dataset.s='ok';offerImport()},
    function(){sync.textContent='Sin conexión con la nube: se muestran los proyectos de este navegador.';sync.dataset.s='bad'});
}
function hid(){try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return []}}
function drop(n){
  var k=n.toLowerCase();
  try{localStorage.removeItem(pk(n));localStorage.removeItem(pk(n)+':cart')}catch(e){}
  store(load().filter(function(x){return x.toLowerCase()!==k}));
  CLOUD=CLOUD.filter(function(x){return !same(x,n)});
  if(EC.on)EC.del(n).catch(function(){alert('No se pudo borrar de la nube. Revisa tu conexión.')});
  if(BUILT.some(function(b){return b.toLowerCase()===k})){var h=hid();h.push(k);try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}
}
function dup(n){
  var l=load(), base='Copia de '+n, nn=base, i=2;
  while(l.concat(BUILT,CLOUD).some(function(x){return same(x,nn)}))nn=base+' '+(i++);
  var name=window.prompt('Nombre del proyecto duplicado:',nn); if(!name||!name.trim())return; name=name.trim().slice(0,60);
  if(l.concat(BUILT,CLOUD).some(function(x){return same(x,name)})){alert('Ya existe un proyecto con ese nombre.');return}

    var ok=false;try{localStorage.setItem(pk(name),txt);ok=true}catch(e){}
    if(EC.on)EC.put(name,txt).then(function(){CLOUD.push(name)},function(){alert('No se pudo guardar la copia en la nube.')});
    else if(!ok){alert('No hay espacio para duplicar. Borra algún proyecto.');return}
    l=load();l.unshift(name);store(l);render();
  }
  var raw=lget(n);
  if(EC.on&&has(CLOUD,n))return EC.get(n).then(function(t){done(t||raw)},function(){if(raw)done(raw);else alert('No se pudo duplicar.')});
  if(raw)return done(raw);
  if(n.toLowerCase()==='gs electronics'){fetch('gs-electronics.json').then(function(r){return r.text()}).then(done).catch(function(){alert('No se pudo duplicar.')});return}

}
function render(){

  var all=BUILT.filter(function(b){return h.indexOf(b.toLowerCase())<0}).concat(list.filter(function(n){return !BUILT.some(function(b){return b.toLowerCase()===n.toLowerCase()})}));

/* side: lado mayor máximo; maxLen: peso máximo. La portada usa más resolución para verse nítida en computadora */
function loadImg(file, cb, onErr, side = 800, maxLen = MAXIMG) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      let s = Math.min(1, side / Math.max(im.width, im.height)), out = '';
      for (let i = 0; i < 8; i++) {
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
        const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        out = cv.toDataURL('image/webp', side > 800 ? 0.9 : 0.85);
        if (out.indexOf('data:image/webp') !== 0) {
          out = side > 800 ? '' : cv.toDataURL('image/png');
          if (!out || out.length > maxLen) { const w = document.createElement('canvas'); w.width = cv.width; w.height = cv.height; const wx = w.getContext('2d'); wx.fillStyle = '#fff'; wx.fillRect(0, 0, w.width, w.height); wx.drawImage(cv, 0, 0); out = w.toDataURL('image/jpeg', 0.88); }
        }
        if (out.length <= maxLen) break;
        s *= side > 800 ? 0.9 : 0.8;
      }
      cb(out, im.width, im.height);
    };
    im.onerror = () => { toast('No se pudo leer la imagen'); if (onErr) onErr(); };
    im.src = r.result;
  };
  r.onerror = () => { toast('No se pudo leer el archivo'); if (onErr) onErr(); };
  r.readAsDataURL(file);
}

const picsOf = p => { const vn = (p && p.vn) || []; return slotsOf(p).map(x => ({s: x.s, n: String(vn[x.c] || '')})); };
function picsApply(p, list) {
  list = list.filter(x => x && x.s).slice(0, PIC_MAX);
  p.img = list[0] ? list[0].s : '';
  const v = [list[1] ? list[1].s : '', list[2] ? list[2].s : ''];
  while (v.length && !v[v.length - 1]) v.pop();
  if (v.length) p.vars = v; else delete p.vars;
  const g = list.slice(PIC_COL).map(x => x.s); if (g.length) p.gal = g; else delete p.gal;
  const n = list.map(x => String(x.n || '').slice(0, 24)); if (n.some(Boolean)) p.vn = n; else delete p.vn;
}
function picsMove(p, from, to) { const l = picsOf(p); if (!(from >= 0 && from < l.length) || !(to >= 0 && to < l.length) || from === to) return false; l.splice(to, 0, l.splice(from, 1)[0]); picsApply(p, l); return true; }
function picsDel(p, i) { const l = picsOf(p); if (!(i >= 0 && i < l.length)) return false; l.splice(i, 1); picsApply(p, l); return true; }
function picsAdd(p, urls) { const l = picsOf(p); let n = 0; for (const u of urls) { if (!u || l.length >= PIC_MAX) break; l.push({s: u, n: ''}); n++; } picsApply(p, l); return n; }
// PICS-CORE:end
function setSlot(p, i, url) {
  if (i >= PIC_COL) { const a = Array.isArray(p.gal) ? p.gal.filter(Boolean) : []; const j = i - PIC_COL; if (url) a[Math.min(j, a.length)] = url; else if (j < a.length) a.splice(j, 1); if (a.length) p.gal = a; else delete p.gal; return; }
  if (!i) { p.img = url || ''; return; }
  p.vars = Array.isArray(p.vars) ? p.vars : [];
  while (p.vars.length < i) p.vars.push('');
  p.vars[i - 1] = url || '';
  while (p.vars.length && !p.vars[p.vars.length - 1]) p.vars.pop();
  if (!p.vars.length) delete p.vars;
}
/* la primera edición guarda el original, para poder volver a él con «Restaurar original» */
function keepOrig(p, i) {
  if (i >= PIC_COL) return; /* los originales solo se guardan para la principal y los 2 colores */
  const cur = getSlot(p, i); if (!cur) return;
  p.og = Array.isArray(p.og) ? p.og : [];
  while (p.og.length <= i) p.og.push('');
  if (!p.og[i]) p.og[i] = cur;
}
function dropOrig(p, i) { if (!p.og) return; p.og[i] = ''; while (p.og.length && !p.og[p.og.length - 1]) p.og.pop(); if (!p.og.length) delete p.og; }
const oKey = (pid, i) => i ? pid + '#' + i : pid;
async function photoFrom(file) {
  const im = await readImage(file); if (!im) return null;
  const src = shrink(im, 1600), fr = autoFrame(src);
  let orig = null; try { orig = Object.assign({src: src.toDataURL('image/webp', .9)}, fr); } catch (e) {}
  return {url: cropTo(src, fr), orig};
}
/* ---------- fotos secundarias: hasta 10 por producto, en el orden que elijas (p.gal) ---------- */
// GAL-CORE:start
const GAL_MAX = 10;
const galOf = p => Array.isArray(p && p.gal) ? p.gal.filter(Boolean).slice(0, GAL_MAX) : [];
function galSet(p, a) { a = (a || []).filter(Boolean).slice(0, GAL_MAX); if (a.length) p.gal = a; else delete p.gal; }
function galMove(p, from, to) { const a = galOf(p); if (!(from >= 0 && from < a.length) || !(to >= 0 && to < a.length) || from === to) return false; a.splice(to, 0, a.splice(from, 1)[0]); galSet(p, a); return true; }
function galDel(p, i) { const a = galOf(p); if (!(i >= 0 && i < a.length)) return false; a.splice(i, 1); galSet(p, a); return true; }
// GAL-CORE:end
/* fotos de colores: desde la posición elegida, una tras otra */
async function addSlotPhotos(files, pid, from) {
  const p = prod(pid); if (!p) return;
  files = files.filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('Usa una imagen (JPG, PNG, WebP o SVG)'); return; }
  setStatus('Preparando fotos…', 'busy');
  let i = from, n = 0;
  for (const f of files) {
    if (i >= PIC_MAX) break;
    const r = await photoFrom(f); if (!r) continue;
    setSlot(p, i, r.url); dropOrig(p, i); if (r.orig) ORIG.set(oKey(pid, i), r.orig);
    i++; n++;
  }
  setStatus('', '');
  if (!n) return;
  if (from > 0) CARDC[pid] = from;
  render(); commit(); if (ED.on) renderProps(true);
  toast(n > 1 ? `${n} fotos listas, centradas en la zona segura` : from ? 'Foto de color lista' : 'Foto lista');
  if (files.length > n && from + files.length > PIC_MAX) toast(`Cada producto tiene hasta ${PIC_MAX} fotos`);
}
/* galería unificada: varias fotos desde un solo selector; llenan la galería del producto en orden (principal, colores, secundarias) */
async function addPics(files, pid) {
  const p = prod(pid); if (!p) return;
  files = files.filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('Usa una imagen (JPG, PNG, WebP o SVG)'); return; }
  const room = PIC_MAX - slotsOf(p).length;
  if (room <= 0) { toast(`Este producto ya tiene las ${PIC_MAX} fotos. Quita una para subir otra.`); return; }
  setStatus('Preparando fotos…', 'busy');
  const urls = [], origs = [];
  for (const f of files) { if (urls.length >= room) break; const r = await photoFrom(f); if (!r) continue; urls.push(r.url); origs.push(r.orig); }
  setStatus('', '');
  if (!urls.length) return;
  const base = picsOf(p).length; picsAdd(p, urls);
  origs.forEach((o, k) => { const c = base + k; if (c < PIC_COL) { dropOrig(p, c); if (o) ORIG.set(oKey(pid, c), o); } });
  render(); commit(); if (ED.on) renderProps(true);
  const tot = slotsOf(p).length;
  toast(files.length > room ? `Se subieron ${urls.length} fotos: el máximo es ${PIC_MAX} por producto` : `${urls.length} ${urls.length > 1 ? 'fotos listas' : 'foto lista'} (${tot}/${PIC_MAX}) · ponles nombre en la galería`);
}
/* fondo del catálogo: más resolución que una foto de producto, porque cubre toda la pantalla */
async function bgImageFile(file) {
  const im = await readImage(file); if (!im) return;
  const src = shrink(im, 1920); let url = '', q = .85;
  for (let k = 0; k < 6; k++) { url = src.toDataURL('image/webp', q); if (url.indexOf('data:image/webp') !== 0) url = src.toDataURL('image/jpeg', q); if (url.length <= 620000) break; q -= .1; }
  S.store.bgImg = url; render(); commit(); if (ED.on) { select(['bg']); renderProps(true); }
  toast('Imagen de fondo lista: ajusta su opacidad en Propiedades');
}

/* ---------- menú «Editar foto» sobre cada foto del editor ---------- */

function placeMenu(m, mb) {

}
function closePm() { const m = $('#ed-pm'); if (m) { m.remove(); removeEventListener('pointerdown', pmOut, true); } }
function pmOut(e) { const m = $('#ed-pm'); if (m && !m.contains(e.target) && !e.target.closest('.ui-edph')) closePm(); }

/* ---------- corrección de color: tono (espectro), iluminación, saturación, nitidez, detalle, grano y opacidad.
   Fotos de producto: se hornea en la foto (con «Restaurar original»). Portada, logotipo y otras capas: ajuste no destructivo de la capa.
   «Hacer variaciones de color» propone 2 versiones con otro tono ---------- */
const CF_KEYS = [['hu', 'Tono (espectro)', 'var(--c-violet)'], ['br', 'Iluminación', 'var(--c-amber)'], ['sa', 'Saturación', 'var(--c-pink)'], ['sh', 'Nitidez', 'var(--c-cyan)'], ['dt', 'Detalle', 'var(--c-cyan)'], ['gr', 'Grano', 'var(--c-cyan)']];
const cfWrap = x => { x = Math.round(x); while (x > 100) x -= 200; while (x < -100) x += 200; return x; };
function cfBake(src, adj, op, side, cb) {
  const im = new Image();
  im.onload = () => {
    let cv; try { cv = adjProcess(im, adj, side); } catch (e) { cb(null); return; }
    if (op < 100) { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const x = c2.getContext('2d'); x.globalAlpha = op / 100; x.drawImage(cv, 0, 0); cv = c2; }
    let q = .9, u = '';
    do { u = cv.toDataURL('image/webp', q); q -= .1; } while (u.startsWith('data:image/webp') && u.length > 420000 && q > .45);
    if (!u.startsWith('data:image/webp')) u = cv.toDataURL('image/png');
    cb(u);
  };
  im.onerror = () => cb(null); im.src = src;
}
function colorFix(lid, o) {
  o = o || {};
  const pm = String(lid || '').match(/^prod:([^:]+):ph$/), p = pm && prod(pm[1]), slot = p ? cardC(p) : 0, isHero = lid === 'hero';
  let src = '';
  if (p) src = getSlot(p, slot);
  else if (isHero) src = heroList().find(s => !isVid(s)) || '';
  else { const im = adjImgs(el0(lid))[0]; src = im ? (im.dataset.o || im.getAttribute('src') || '') : ''; }
  if (!src || isVid(src)) { toast('Esta capa no tiene una foto para corregir.'); return; }
  const a0 = p ? {} : (adjOf(lid) || {}), st0 = p ? {} : stOf(lid);
  const v = {}; CF_KEYS.forEach(([k]) => { v[k] = num(a0[k]); });
  v.op = st0.opacity != null && st0.opacity !== '' ? clamp(num(st0.opacity), 0, 100) : 100;
  let vars = [], raf = 0, base = null;
  const box = document.createElement('div'); box.className = 'cfx';
  const sl = (k, l, col, min, max) => `<label class="ed-sl${k === 'hu' ? ' hue' : ''}" style="--sc:${col}"><span>${l}<b data-cfv="${k}">${k === 'op' ? v[k] + '%' : (v[k] > 0 ? '+' : '') + v[k]}</b></span><div class="ed-slw${k === 'op' || k === 'gr' ? ' nz' : ''}"><input type="range" min="${min}" max="${max}" step="1" value="${v[k]}" data-cf="${k}" aria-label="${l}"></div></label>`;
  const extra = p ? `<button type="button" class="mbtn" data-cfa="save-cols" disabled>Guardar variaciones como colores del producto</button>` : isHero ? `<button type="button" class="mbtn" data-cfa="save-hero" disabled>Agregar variaciones como portadas</button>` : '';
  box.innerHTML = `<div class="cfx-pv"><img id="cfx-img" alt="Vista previa" draggable="false"></div>
    <div class="cfx-sl">${CF_KEYS.map(([k, l, col]) => sl(k, l, col, k === 'gr' ? 0 : -100, 100)).join('')}${sl('op', 'Opacidad', 'var(--c-blue)', 0, 100)}</div>
    <div class="cfx-tb"><button type="button" class="mbtn dk" data-cfa="vars">✦ Hacer variaciones de color</button><button type="button" class="mbtn" data-cfa="reset">Restablecer</button></div>
    <div class="cfx-vs" id="cfx-vs" hidden></div>${extra ? `<div class="cfx-tb">${extra}</div>` : ''}
    <p class="cfx-n">${p ? 'Se aplica a la foto del producto (puedes volver con «Restaurar original» en Editar foto).' : 'Ajuste de la capa: puedes cambiarlo o quitarlo cuando quieras.'} Toca dos veces un control para volver a cero.</p>`;
  const img = box.querySelector('#cfx-img');
  const adjNow = hu => { const a = {}; CF_KEYS.forEach(([k]) => { const x = k === 'hu' && hu != null ? hu : v[k]; if (x) a[k] = x; }); return a; };
  const paint = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; if (!base) return; try { img.src = adjProcess(base, adjNow(), 520).toDataURL('image/webp', .85); } catch (e) { img.src = src; } img.style.opacity = v.op / 100; });
  };
  const showVars = () => {
    const w = box.querySelector('#cfx-vs');
    w.hidden = !vars.length;
    w.innerHTML = vars.map((x, i) => `<button type="button" data-cfvar="${i}" title="Usar esta variación"><img src="${x.th}" alt=""><span>Variación ${i + 1}</span></button>`).join('');
    box.querySelectorAll('[data-cfa=save-cols],[data-cfa=save-hero]').forEach(b => { b.disabled = !vars.length; });
  };
  const makeVars = () => {
    if (!base) return;
    const off = 50 + Math.random() * 25;
    vars = [cfWrap(v.hu + off), cfWrap(v.hu - off)].map(hu => {
      let th = src; try { th = adjProcess(base, adjNow(hu), 200).toDataURL('image/webp', .8); } catch (e) {}
      return {hu, th};
    });
    showVars(); toast('2 variaciones listas: toca una para usarla');
  };
  const setV = (k, x) => {
    v[k] = x; const i = box.querySelector(`[data-cf="${k}"]`); if (i) i.value = x;
    const b = box.querySelector(`[data-cfv="${k}"]`); if (b) b.textContent = k === 'op' ? x + '%' : (x > 0 ? '+' : '') + x;
  };
  const saveLayer = () => {
    adjSet(lid, a => { CF_KEYS.forEach(([k]) => { if (v[k]) a[k] = v[k]; else delete a[k]; }); });
    const st = stOf(lid, true); if (v.op < 100) st.opacity = v.op; else delete st.opacity; prune(lid);
    adjRestore([lid].filter(l => !adjOf(l))); render(); applyAdj(); commit(); if (ED.on) renderProps(true);
  };
  box.addEventListener('input', e => { const k = e.target.dataset.cf; if (!k) return; setV(k, +e.target.value); paint(); });
  box.addEventListener('dblclick', e => { const k = e.target.dataset.cf; if (!k) return; setV(k, k === 'op' ? 100 : 0); paint(); });
  box.addEventListener('click', e => {
    const vb = e.target.closest('[data-cfvar]'); if (vb) { setV('hu', vars[+vb.dataset.cfvar].hu); paint(); return; }
    const b = e.target.closest('[data-cfa]'); if (!b || b.disabled) return;
    const act = b.dataset.cfa;
    if (act === 'vars') makeVars();
    else if (act === 'reset') { CF_KEYS.forEach(([k]) => setV(k, 0)); setV('op', 100); vars = []; showVars(); paint(); }
    else if (act === 'save-cols') {
      const free = [1, 2].filter(j => !getSlot(p, j));
      if (!free.length) { toast('Este producto ya tiene 3 fotos de color. Quita una en «Fotos de colores».'); return; }
      const list = vars.slice(0, free.length); let left = list.length; b.disabled = true; toast('Guardando variaciones…');
      list.forEach((x, n) => cfBake(src, adjNow(x.hu), v.op, 1600, url => {
        if (url) { setSlot(p, free[n], url); p.vn = Array.isArray(p.vn) ? p.vn : []; while (p.vn.length < 3) p.vn.push(''); if (!p.vn[free[n]]) p.vn[free[n]] = 'Variación ' + (n + 1); }
        if (--left) return;
        render(); commit(); if (ED.on) renderProps(true); toast(`${list.length} ${list.length === 1 ? 'color nuevo' : 'colores nuevos'} en «${p.desc}»`);
      }));
    }
    else if (act === 'save-hero') {
      const room = HERO_MAX - heroList().length;
      if (room <= 0) { toast(`Ya hay ${HERO_MAX} portadas.`); return; }
      const list = vars.slice(0, room); let left = list.length; b.disabled = true; toast('Guardando portadas…');
      /* la capa «hero» ya lleva el ajuste: cada portada nueva solo guarda la diferencia de tono */
      saveLayer();
      list.forEach(x => cfBake(src, {hu: cfWrap(x.hu - v.hu)}, 100, 2400, url => {
        if (url) { S.store.heroX = Array.isArray(S.store.heroX) ? S.store.heroX : []; S.store.heroX.push(url); }
        if (--left) return;
        render(); commit(); if (ED.on) renderProps(true); toast(`${list.length} ${list.length === 1 ? 'portada nueva' : 'portadas nuevas'}`);
      }));
    }
  });
  modal('Corrección de color', box, [{label: 'Cancelar', val: false}, {label: 'Guardar', cls: 'dk', run: () => {
    const a = adjNow(), changed = Object.keys(a).length || v.op < 100;
    if (p) {
      if (!changed) return;
      toast('Aplicando a la foto…');
      cfBake(src, a, v.op, 1600, url => { if (!url) { toast('No se pudo procesar la foto.'); return; } keepOrig(p, slot); setSlot(p, slot, url); ORIG.delete(oKey(p.id, slot)); render(); commit(); if (ED.on) renderProps(true); toast('Color corregido'); });
    } else { saveLayer(); toast(changed ? 'Color corregido' : 'Ajustes de color quitados'); }
  }}], 'mb-cfx');
  const im0 = new Image();
  im0.onload = () => { base = im0; paint(); if (o.vars) makeVars(); };
  im0.onerror = () => { img.src = src; };
  img.src = src; im0.src = src;
}

/* ---------- procesamiento de imagen en segundo plano (Web Worker): recorte del producto y mejora fiel ---------- */
function workerMain() {
  const clampN = (v, a, b) => v < a ? a : v > b ? b : v;
  const C = {};
  self.onmessage = e => {
    const m = e.data;
    try { const r = F[m.fn](m); self.postMessage({id: m.id, ok: true, r}, r && r.tr ? r.tr : []); }
    catch (err) { self.postMessage({id: m.id, ok: false, err: String((err && err.message) || err)}); }
  };
  /* distancia (chaflán 3-4) desde cada píxel marcado hasta el más cercano sin marcar */
  function dist(mask, w, h) {
    const N = w * h, d = new Float32Array(N), INF = 1e9;
    for (let i = 0; i < N; i++) d[i] = mask[i] ? INF : 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (!d[i]) continue; let v = d[i];
      if (x > 0) v = Math.min(v, d[i - 1] + 3); else v = Math.min(v, 3);
      if (y > 0) { v = Math.min(v, d[i - w] + 3); if (x > 0) v = Math.min(v, d[i - w - 1] + 4); if (x < w - 1) v = Math.min(v, d[i - w + 1] + 4); } else v = Math.min(v, 3);
      d[i] = v;
    }
    for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {

// RECOG-CORE:start
/* foto de catálogo = borde casi blanco y parejo (o transparente). d: RGBA de w×h. Devuelve 0..1 */
function whiteScore(d, w, h) {
  const b = Math.max(2, Math.round(Math.min(w, h) * .05)), st = Math.max(1, Math.round(Math.min(w, h) / 120));
  let n = 0, wh = 0, s = 0, s2 = 0;
  const at = (x, y) => {
    const i = (y * w + x) * 4, a = d[i + 3] / 255, r = d[i] * a + 255 * (1 - a), g = d[i + 1] * a + 255 * (1 - a), bl = d[i + 2] * a + 255 * (1 - a);
    const L = (r + g + bl) / 3, ch = Math.max(r, g, bl) - Math.min(r, g, bl);
    n++; s += L; s2 += L * L; if (L >= 238 && ch <= 20) wh++;
  };
  for (let y = 0; y < h; y += st) for (let x = 0; x < w; x += st) if (y < b || y >= h - b || x < b || x >= w - b) at(x, y);
  if (!n) return 0;
  const m = s / n, sd = Math.sqrt(Math.max(0, s2 / n - m * m));
  return Math.max(0, Math.min(1, wh / n - Math.min(.3, sd / 250)));
}
/* la mejor foto: fondo blanco primero; entre parecidas, la más grande */
function pickCatalog(list) {
  const ok = list.filter(c => c && c.score >= 0);
  if (!ok.length) return null;
  return ok.slice().sort((a, b) => (b.score >= .6) - (a.score >= .6) || Math.round((b.score - a.score) * 10) || Math.min(b.w, b.h) - Math.min(a.w, a.h))[0];
}
/* qué casillas vienen marcadas: foto si hay una con fondo blanco; nombre si la IA está segura o el actual es de relleno; precio solo si el producto no tiene precio real */
function recogPlan(cur, r, best) {

/* subida en lote: reconoce las fotos de la lista (2 a la vez) y llena cada fila para revisarla */
async function bulkRecog() {

    if (keep) Object.assign(x.rc, {img: keep.img, orig: keep.orig, white: keep.white, site: keep.site, usePhoto: keep.usePhoto, pasted: true, prevPd: keep.prevPd, prevName: keep.prevName});
    if (plan.name && o.r.name) x.name = o.r.name.slice(0, DESC_MAX);

}

    }

    if (br) return go(() => arrange(br === ']' ? (e.shiftKey ? 'front' : 'up') : (e.shiftKey ? 'back' : 'down')));
    if (e.shiftKey && (code === 'Period' || k === '.' || k === '>' || k === ':')) return go(() => fontStep(2));
